name: SEO – lista dnia

# S18 (docs/SEO-AUTOMAT.md): raz na dobę wybiera do 10 priorytetowych adresów (bez gmin i miejscowości), wysyła je do
# IndexNow (Bing) i nadpisuje JEDNO stałe zgłoszenie z etykietą seo-dzien (checklista dla Search Console, Google).
# S18b: właściciel przypina je ręcznie raz (GITHUB_TOKEN nie ma uprawnień do przypinania). Odhaczone adresy trafiają do
# sekcji „Zrobione” i nie wracają; nieodhaczone wracają na listę następnego dnia. Błąd IndexNow = ostrzeżenie.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

# contents: read – checkout; issues: write – zgłoszenie seo-dzien (tworzenie, edycja, zamykanie duplikatów).
permissions:
  contents: read
  issues: write

concurrency:
  group: seo-daily-list
  cancel-in-progress: false

jobs:
  daily-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: seo-dzien
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Wylicz listę dnia i wyślij do IndexNow
        run: node scripts/seo/daily-batch.mjs --out-dir "$RUNNER_TEMP/daily"

      - name: Zgłoszenie z listą dnia (jedno stałe, nadpisywane)
        run: |
          gh label create "$LABEL" --color 0E8A16 --description "Lista dnia do Search Console" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          TITLE=$(cat "$RUNNER_TEMP/daily/title.txt")
          # otwarte zgłoszenia seo-dzien, od najnowszego; najnowsze zostaje, reszta to duplikaty
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 100 --json number -q 'sort_by(.number) | reverse | .[].number')
          KEEP=$(echo "$OPEN" | head -n 1)
          if [ -z "$KEEP" ]; then
            if [ ! -s "$RUNNER_TEMP/daily/batch.txt" ]; then
              echo "::warning::Lista dnia jest pusta (wszystko odhaczone albo brak mapy strony) i nie ma zgłoszenia – nic nie zakładam."
              exit 0
            fi
            URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/daily/issue.md")
            echo "Utworzono stałe zgłoszenie: $URL (przypnij je ręcznie: ⋯ → Pin issue)."
            exit 0
          fi
          # odhaczone adresy ze wszystkich zgłoszeń zebrał już skrypt (też ze starszych duplikatów) i zapisał w issue.md
          gh issue edit "$KEEP" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/daily/issue.md"
          echo "Zaktualizowano zgłoszenie #$KEEP."
          for N in $(echo "$OPEN" | tail -n +2); do
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "Duplikat: lista dnia jest teraz w jednym stałym zgłoszeniu #$KEEP. Odhaczone adresy zostały przeniesione." || true
          done
