name: Zasady PR

# Sprawdzenie `zasady-pr`: ID zadania, zakres plików, pliki zapalne, nowe zależności (docs/UZUPELNIENIE_WORKFLOW.md).
# Logika i lista zapalnych pochodzą z gałęzi docelowej (main), nie z PR, żeby PR nie mógł osłabić własnej kontroli.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: zasady-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zasady-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Zbierz dane PR
        run: node scripts/ci/pr-rules-collect.mjs .github/zapalne.txt "$RUNNER_TEMP/pr-input.json"
      - name: Sprawdź zasady
        run: node scripts/ci/pr-rules-cli.mjs "$RUNNER_TEMP/pr-input.json"
