name: Sprzątanie gałęzi (jednorazowe)
# Tymczasowe: usuwa stare gałęzie scalonych/zamkniętych PR. Plik zostanie usunięty w następnym commicie PR #200.
on:
  pull_request:
permissions:
  contents: write
jobs:
  usun:
    if: github.event.pull_request.head.ref == 'v5-struktura'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Usuń gałęzie z listy
        shell: bash
        run: |
          ok=0; bad=0
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|v5-struktura|s14-10-profile-indicator-trend-1705480663915908072) continue;; esac
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" >/dev/null 2>&1; then ok=$((ok+1)); else bad=$((bad+1)); echo "nie usunięto: $b"; fi
