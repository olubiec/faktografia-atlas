name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to commit snapshots to'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --user root
    env:
      HOME: /root
      CI: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Update Playwright snapshots
        run: pnpm exec playwright test tests/e2e/design.spec.ts --update-snapshots

      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/design.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore: update design snapshots"
            git push origin HEAD:${{ github.event.inputs.branch }}
          fi
