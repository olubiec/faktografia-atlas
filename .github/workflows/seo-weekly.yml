name: SEO tygodniowy raport

# Co poniedziałek tworzy zgłoszenie „SEO – tydzień <data>” z liczbami z Search Console i czerwonymi flagami.
# Wymaga sekretu GSC_SERVICE_ACCOUNT (docs/SEO.md §7); bez niego krok kończy się komunikatem i kodem 0.
on:
  schedule:
    - cron: '17 6 * * 1' # poniedziałek ok. 07:17–08:17 czasu polskiego
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  raport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Raport z Search Console
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/seo/gsc-report.mjs
