name: Fetch library

# Robot „Biblioteka GUS”: co 12 godzin pobiera kolejną porcję całego BDL (katalog działów i zmiennych, potem wartości
# na poziomie powiatów i gmin) i zapisuje ją na gałęzi `data/library` (NIGDY na main).
# Limity API: z kluczem 10/s, 500 / 15 min, 5000 / 12 h, 50 000 / 7 dni. Budżet jednego przebiegu = 3000 zapytań
# (2 przebiegi dziennie = 6000; nocny „Fetch data” ok. 750; razem 47 250 / 7 dni = 94,5% limitu, patrz checkWindows
# w scripts/data/library-priority.mjs). Tempo 1 zapytanie / 2 s: 3000 zapytań to ok. 100 min.
# Kolejność pobierania: config/library-priority.json (najpierw wskaźniki podstawowe i popularne).
# Grupa `fetch-data` jest wspólna z nocnym pobieraniem: oba roboty nigdy nie biją w API jednocześnie.
# Wznawianie: stan w library/state.json; uruchomienie pobiera tylko to, czego jeszcze nie ma.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Maks. liczba zapytań do API w tym przebiegu'
        required: false
        default: '3000'
  schedule:
    - cron: '40 4,16 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      BRANCH: data/library
      LIBRARY_BUDGET: ${{ github.event.inputs.budget || '3000' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Przygotuj katalog roboczy z gałęzi data/library (osobna historia, bez kodu strony)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$BRANCH"
            git worktree add -B "$BRANCH" lib-wt "origin/$BRANCH"
          else
            git worktree add --detach lib-wt
            git -C lib-wt checkout --orphan "$BRANCH"
            git -C lib-wt rm -rf -q .
          fi

      - name: Sprawdź sekret
        env:
          BDL_CLIENT_ID: ${{ secrets.BDL_CLIENT_ID }}
        run: |
          [ -n "$BDL_CLIENT_ID" ] || { echo "::error::Brak sekretu BDL_CLIENT_ID."; exit 1; }

      - name: Pobierz porcję danych (w granicach budżetu zapytań)
        timeout-minutes: 150
        env:
          BDL_CLIENT_ID: ${{ secrets.BDL_CLIENT_ID }}
          LIBRARY_DIR: lib-wt/library
          LIBRARY_MINUTES: '130'
          LIBRARY_SUMMARY_FILE: ${{ runner.temp }}/library-sections.md
        run: node scripts/data/library.mjs 2>&1 | tee "$RUNNER_TEMP/library.txt"

      - name: Zbuduj spis biblioteki (index.json)
        if: always()
        env:
          LIBRARY_DIR: lib-wt/library
        run: |
          if [ -f lib-wt/library/catalog.json ]; then
            node scripts/data/library-index.mjs
            ls -l lib-wt/library/index.json
          else
            echo "Brak katalogu – spis pominięty."
          fi

      - name: Zbuduj mały spis pobranych wskaźników (available.json)
        if: always()
        run: |
          if [ -f lib-wt/library/index.json ] && [ -d lib-wt/library/values ]; then
            node scripts/data/library-available.mjs lib-wt/library | tee "$RUNNER_TEMP/library-gap.txt"
            ls -l lib-wt/library/available.json
          else
            echo "Brak indeksu lub wartości – spis pominięty."
          fi

      - name: Zapisz status robota (status.json)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p lib-wt/library
          node scripts/data/status.mjs --values public/data/values --library lib-wt/library --out lib-wt/library/status.json

      - name: Podsumowanie
        if: always()
        run: |
          { echo '### Biblioteka GUS'; echo; tail -n 3 "$RUNNER_TEMP/library.txt" 2>/dev/null; echo; cat "$RUNNER_TEMP/library-sections.md" 2>/dev/null; echo; tail -n 1 "$RUNNER_TEMP/library-gap.txt" 2>/dev/null; echo; du -sh lib-wt/library 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

      - name: Zapisz na gałęzi data/library
        if: always()
        working-directory: lib-wt
        run: |
          git add -f library/
          if git diff --staged --quiet; then echo "Brak zmian."; exit 0; fi
          git commit -m "data: biblioteka GUS – kolejna porcja"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Zgłoszenie błędu pobierania biblioteki
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          T="Pobieranie biblioteki (Fetch library) nie powiodło się"
          if [ -z "$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title==\"$T\") | .number" | head -n1)" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$T" \
              -f body="Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (zdarzenie: $GITHUB_EVENT_NAME). Co zrobić: wklej ten link Planiście (TRYB: POMOC)." >/dev/null
          fi
