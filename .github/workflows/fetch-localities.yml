name: Fetch localities (PRNG)

# Tylko ręcznie. Wynik trafia na osobną gałąź (domyślnie data/localities),
# nigdy do main: właściciel otwiera z niej PR, a Claude sprawdza liczby.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Gałąź docelowa dla public/data/localities.json (nie main)'
        required: true
        default: 'data/localities'

permissions:
  contents: write

jobs:
  fetch-localities:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      BRANCH: ${{ github.event.inputs.branch }}
    steps:
      - name: Odmów zapisu do main
        run: |
          if [ "$BRANCH" = "main" ] || [ -z "$BRANCH" ]; then
            echo "::error::Gałąź docelowa nie może być main ani pusta."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Przełącz na gałąź docelową (utwórz od main, jeśli nie istnieje)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pobrane strony PRNG (253 tys. obiektów, ok. 1700 stron) zostają w cache między uruchomieniami:
      # gdy uruchomienie skończy się przed czasem albo na błędzie, następne wznawia od brakujących stron.
      - name: Przywróć pobrane strony PRNG
        uses: actions/cache/restore@v6
        with:
          path: ~/prng-pages
          key: prng-pages-${{ github.run_id }}
          restore-keys: prng-pages-

      # `shell: bash` włącza pipefail: bez niego błąd skryptu przed `| tee` był ukryty.
      # Kod 3 = pobrano częściowo (limit czasu): strony są zapisane, trzeba uruchomić workflow ponownie.
      - name: Fetch PRNG localities
        id: fetch
        shell: bash
        run: |
          set +e
          pnpm localities --pages-dir "$HOME/prng-pages" --time-budget-min 100 --timeout-ms 60000 --concurrency 3 2>&1 | tee "$RUNNER_TEMP/localities-report.txt"
          code=${PIPESTATUS[0]}
          set -e
          echo "Stron w cache: $(ls "$HOME/prng-pages" 2>/dev/null | wc -l)"
          if [ "$code" = "3" ]; then
            echo "::error::Pobrano częściowo ($(grep -m1 -o 'Pobrano [0-9]*/[0-9]* stron' "$RUNNER_TEMP/localities-report.txt")). Uruchom workflow ponownie: wznowi od brakujących stron."
            exit 1
          elif [ "$code" != "0" ]; then
            echo "::error::pnpm localities nie powiodło się. PRZYCZYNA: $(grep -m2 -E 'Failed to fetch|Error' "$RUNNER_TEMP/localities-report.txt" | tr '\n' ' ' | cut -c1-500) | KONIEC LOGU: $(tail -n 3 "$RUNNER_TEMP/localities-report.txt" | tr '\n' ' ' | cut -c1-300). Pobrane strony są zapisane – uruchom ponownie."
            exit 1
          fi

      - name: Zapisz pobrane strony PRNG
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/prng-pages
          key: prng-pages-${{ github.run_id }}

      - name: Sprawdź plik wynikowy
        shell: bash
        run: |
          if [ ! -s public/data/localities.json ]; then
            echo "::error::Brak pliku public/data/localities.json po pobraniu (skrypt zakończył się bez wyniku)."
            exit 1
          fi
          echo "Plik public/data/localities.json: $(wc -c < public/data/localities.json) bajtów."

      - name: Podsumowanie zadania
        if: always()
        run: |
          {
            echo "### Miejscowości (PRNG)"
            echo '```'
            cat "$RUNNER_TEMP/localities-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zatwierdź i wypchnij tylko public/data/localities.json
        shell: bash
        run: |
          git add public/data/localities.json
          if git diff --staged --quiet; then
            echo "Brak zmian w public/data/localities.json."
          else
            git commit -m "data: update PRNG localities"
            if ! git push origin "HEAD:refs/heads/$BRANCH" 2>&1 | tee "$RUNNER_TEMP/push.log"; then
              echo "::error::git push na gałąź $BRANCH nie powiódł się: $(tail -n 4 "$RUNNER_TEMP/push.log" | tr '\n' ' ' | cut -c1-600)"
              exit 1
            fi
          fi
