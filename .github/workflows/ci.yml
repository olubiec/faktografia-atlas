# Runner przypięty do ubuntu-24.04: od 19.10.2026 etykieta ubuntu-latest przechodzi na Ubuntu 26 (komunikat GitHub Actions); od 26.10 testy e2e na ubuntu-latest zaczęły padać i przekraczać czas bez zmian w kodzie. Zrzuty (update-snapshots) muszą powstawać na tym samym systemie co CI.
name: CI

# Wzór: WORKFLOW UNIWERSALNY v5.3, §10.5 (dopasowany do Faktografii: e2e to `pnpm test:e2e`,
# przeglądarka z obrazu Playwright, konfiguracja skanu sekretów w .gitleaks.toml).
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['tasks/**']   # push plików fali (Jules Loop) nie odpala 30-minutowego CI
  workflow_dispatch:

# Nowy commit w tym samym PR anuluje poprzedni, trwający przebieg (na main nic nie anulujemy:
# pętla czeka na wynik CI po scaleniu fali).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --user root
    env:
      HOME: /root
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # interfejs: testy w przeglądarce + dostępność (Playwright + axe)
      - run: pnpm test:e2e

      - name: Raport Playwright (tylko przy błędzie)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  bezpieczenstwo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # szuka kluczy; konfiguracja w .gitleaks.toml (konto osobiste – bez licencji)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Audyt pakietów (produkcyjne, poziom wysoki)
        run: pnpm audit --prod --audit-level high
