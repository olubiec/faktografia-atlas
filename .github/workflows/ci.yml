name: CI

# Wzór: WORKFLOW UNIWERSALNY v5.3, §10.5 (dopasowany do Faktografii: e2e to `pnpm test:e2e`,
# przeglądarka z obrazu Playwright, konfiguracja skanu sekretów w .gitleaks.toml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      options: --user root
    env:
      HOME: /root
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # interfejs: testy w przeglądarce + dostępność (Playwright + axe)
      - run: pnpm test:e2e

      - name: Raport Playwright (tylko przy błędzie)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  bezpieczenstwo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # szuka kluczy; konfiguracja w .gitleaks.toml (konto osobiste – bez licencji)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Audyt pakietów (produkcyjne, poziom wysoki)
        run: pnpm audit --prod --audit-level high
